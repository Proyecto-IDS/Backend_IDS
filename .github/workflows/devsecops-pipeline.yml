name: "Pipeline de Seguridad Java (Vista Detallada)"

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Escaneo de Secretos (La base)
  seguridad-secretos:
    name:  Validar Secretos
    uses: DevSecOps-Uni-Project/.github/.github/workflows/secrets-scan.yml@main

  # 2. Escaneo de Librerías (SCA)
  seguridad-librerias:
    name:  Validar Dependencias
    needs: seguridad-secretos
    uses: DevSecOps-Uni-Project/.github/.github/workflows/snyk-scan.yml@main
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # 3. Escaneo de Infraestructura (IaC) - NUEVO
  seguridad-infraestructura:
    name:  Validar Docker/IaC
    needs: seguridad-secretos
    uses: DevSecOps-Uni-Project/.github/.github/workflows/checkov-scan.yml@main

  # 4. Calidad de Código (SAST)
  # Lo dejamos aquí para tener control total de los parámetros de Sonar
  calidad-codigo:
    name: 📊 Calidad SonarCloud
    needs: [seguridad-librerias, seguridad-infraestructura]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21 (Microsoft Distro)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft' # Usamos la misma que funcionaba antes
          cache: 'maven'

      - name: Build y Análisis con Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean compile org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -DskipTests \
            -Dsonar.projectKey=Proyecto-IDS_Backend_IDS \
            -Dsonar.organization=proyecto-ids \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.exclusions=**/*

    