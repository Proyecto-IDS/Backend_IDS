name: "Pipeline de Seguridad Java"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # Job 1: Escaneo de Secretos
  seguridad-secretos:
    uses: DevSecOps-Uni-Project/.github/.github/workflows/secrets-scan.yml@main

  # Job 2: Escaneo de Librerías (Alineado con el Job 1)
  seguridad-librerias:
    needs: seguridad-secretos
    uses: DevSecOps-Uni-Project/.github/.github/workflows/snyk-scan.yml@main
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}