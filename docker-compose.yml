# Docker Compose for local development
# This file is for LOCAL DEVELOPMENT ONLY
# For production, use AWS RDS for PostgreSQL

version: '3.8'

services:
  # PostgreSQL Database (for local development)
  # In production, replace this with AWS RDS PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ids-postgres
    environment:
      POSTGRES_DB: ids_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ids-network

  # Spring Boot Application
  app:
    build: .
    container_name: ids-backend
    depends_on:
      - postgres
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env.local
    environment:
      # Override database configuration for containerized development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ids_database
      DB_USERNAME: postgres
      DB_PASSWORD: password
      
      # Application configuration
      SPRING_PROFILES_ACTIVE: development
      
    networks:
      - ids-network

volumes:
  postgres_data:

networks:
  ids-network:
    driver: bridge

# Usage:
# For local development: docker-compose up -d
# To build and run: docker-compose up --build
# To stop: docker-compose down
# To clean up: docker-compose down -v

# AWS Production Configuration Notes:
# 1. Replace postgres service with AWS RDS PostgreSQL endpoint
# 2. Update environment variables in app service with actual AWS endpoints
# 3. Consider using AWS ECS or EKS for container orchestration
# 4. Use AWS Secrets Manager for sensitive configuration values