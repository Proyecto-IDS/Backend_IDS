# Test profile - No database, no kafka required
spring.application.name=ids-ia
server.port=${SERVER_PORT:8080}

# Disable database auto-configuration for testing
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Disable OAuth2 for testing
spring.security.oauth2.resourceserver.jwt.issuer-uri=

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:defaultpassword}

# Actuator Configuration (for health checks)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging Configuration
logging.level.com.arsw.ids_ia=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n