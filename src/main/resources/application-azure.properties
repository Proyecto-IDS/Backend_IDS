# 🚀 Azure Production Configuration
# Override local settings for Azure deployment

# 🌐 CORS and WebSocket Configuration
app.cors.allowed-origins=${FRONTEND_URL:*}
app.websocket.allowed-origins=${FRONTEND_URL:*}

# 🔧 Azure-specific settings
server.forward-headers-strategy=framework

# 🔐 Security headers for production
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none

# 📡 WebSocket configuration for Azure
spring.websocket.allowed-origins=${FRONTEND_URL:*}