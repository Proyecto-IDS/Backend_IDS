# Application Configuration
spring.application.name=ids-ia
server.port=${SERVER_PORT:8080}

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ids_database}?sslmode=prefer
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:defaultpassword}

# OAuth2 Resource Server (Google)
# Set the issuer URI to Google's accounts issuer so Spring can fetch JWKS and validate tokens
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
# For audience validation, set your Google OAuth client id here (the frontend client id)
app.security.oauth2.client-id=${GOOGLE_CLIENT_ID:726070894035-v70v33n6cteen3q72ae4j0u7nrpmbss6.apps.googleusercontent.com}

# Initial Admin Users (comma-separated list of emails)
app.initial-admins=${INITIAL_ADMINS:estebanac0903@gmail.com,barrerovelasquezcarlosdavid@gmail.com,juansebastianipc@gmail.com}

# Machine Learning Model Configuration
ml.prediction.endpoint=${ML_ENDPOINT:https://j7gb7hbknl.execute-api.us-east-1.amazonaws.com/predict}

# Google Gemini AI Configuration
# Get your free API key at: https://aistudio.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY}

# Actuator Configuration (for health checks)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Logging Configuration
logging.level.com.arsw.ids_ia=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/ids-application.log
